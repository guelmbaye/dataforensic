name: dataforensic-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataforensic
      POSTGRES_PASSWORD: dataforensic
      POSTGRES_DB: dataforensic
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforensic"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://dataforensic:dataforensic@postgres:5432/dataforensic
    ports: ["8000:8000"]
    volumes:
      - ./scenarios:/srv/scenarios:ro
      - ./datahub/seed:/srv/datahub/seed:ro
      - dataforensic-state:/srv/state
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

  # ---------------------------------------------------------------------
  # DataHub itself is NOT declared here. DataHub Core is a ten-service stack
  # (GMS, frontend, Elasticsearch, Kafka, MySQL, setup jobs) with its own
  # maintained compose; copying it into this file would mean maintaining a fork
  # of it. Start it with its own tool and attach it to this network:
  #
  #     uvx --from acryl-datahub datahub docker quickstart
  #     docker network connect --alias datahub-gms \
  #       dataforensic_default datahub-datahub-gms-quickstart-1
  #
  # The alias matters: the quickstart names its containers
  # datahub-datahub-gms-quickstart-1 / datahub-frontend-quickstart-1, and an
  # alias keeps a readable hostname in .env instead of pinning those.
  #
  # Without it, DATAHUB_MODE=auto falls back to the deterministic graph and
  # labels every result DEMO_FIXTURE.
  #
  # The MCP server is a different matter: the official mcp-server-datahub is a
  # *stdio* server (the Streamable HTTP endpoint is a DataHub Cloud feature), so
  # it needs a bridge to be reachable over HTTP. supergateway does exactly that.
  #     docker compose --profile datahub up -d
  # ---------------------------------------------------------------------
  mcp:
    profiles: ["datahub"]
    # Built here rather than pulled: the published supergateway image is
    # musl-based and mcp-server-datahub cannot install on it. See
    # datahub/mcp-bridge/README.md.
    build:
      context: ./datahub/mcp-bridge
    container_name: dataforensic-mcp
    # env_file as well: `${DATAHUB_TOKEN}` is compose interpolation, which
    # silently yields an empty string when the variable is not where compose
    # looks for it. The server then starts, fails to authenticate, and the
    # bridge answers empty — indistinguishable from a transport problem.
    env_file: [.env]
    environment:
      DATAHUB_GMS_URL: ${DATAHUB_URL:-http://datahub-gms:8080}
      DATAHUB_GMS_TOKEN: ${DATAHUB_TOKEN:-}
      TOOLS_IS_MUTATION_ENABLED: "false"
    ports: ["8001:8000"]

volumes:
  postgres-data:
  dataforensic-state:
